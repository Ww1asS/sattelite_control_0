data:
  root: data/raw/LEVIR CD
  img_size: 256
  batch_size: 8
  num_workers: 0

model:
  encoder_name: resnet50
  pretrained: true
  num_classes: 1

training:
  epochs: 100
  lr: 0.0001
  weight_decay: 0.0001
  threshold: 0.5
  patience: 999

paths:
  log_dir: results/logs
  checkpoint_dir: results/checkpoints